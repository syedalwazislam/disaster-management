# Part I — production-style stack (Dockerfile image + Mongo with persistent volume)
services:
  web:
    build: .
    image: ${DOCKERHUB_USER:-yourdockerhub}/disaster-management:latest
    container_name: dm-web-prod
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-disasterdb}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: dm-mongo-prod
    volumes:
      - mongo_data_part1:/data/db
    restart: unless-stopped

volumes:
  mongo_data_part1:
